  <script src="data/teams.js"></script>

  <div id="teamSearchResultsDropdown"></div>
  <script>
    // Just a mock to see if errors occur
    try {
      window.initTeamSearch();

    } catch (e) {
      console.error("Error:", e);
    }
  </script>
</body>
