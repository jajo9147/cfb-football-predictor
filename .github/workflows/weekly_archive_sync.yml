name: Weekly Archive & Model Calibration Sync

on:
  schedule:
    # Saturday 15:00 UTC (11:00 AM ET) - Pre-kickoff snapshot
    - cron: '0 15 * * 6'
    # Sunday 08:00 UTC (4:00 AM ET) - Post-game settlement & Brier grading
    - cron: '0 8 * * 0'
    # Tuesday 14:00 UTC (10:00 AM ET) - Post-AP Poll Weekly Model Retraining & Calibration
    - cron: '0 14 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive_and_calibrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Weekly Simulation Snapshot
        run: python3 scripts/generate_snapshot.py

      - name: Settle Accuracy & Calculate Brier Score
        run: python3 scripts/settle_week_accuracy.py

      - name: Retrain Model & Recalculate Future Projections
        run: |
          python3 scripts/retrain_weekly_model.py
          # Synchronize updated datasets to mobile web packages
          cp data/teams.js data/teams_v3.js ios/CFBProphet/www/data/ || true
          cp data/teams.js data/teams_v3.js android/app/src/main/assets/www/data/ || true

      - name: Commit and Push Archive & Model Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/ data/ ios/ android/
          if git diff --staged --quiet; then
            echo "No archive or model changes to commit"
          else
            git commit -m "chore(model): automated weekly retraining, calibration, and future projections update"
            git push origin main
          fi
