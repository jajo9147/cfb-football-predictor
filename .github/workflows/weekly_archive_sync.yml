name: Gridiron Oracle Weekly Archive & CI/CD

on:
  schedule:
    # Run every Saturday at 15:00 UTC (11:00 AM ET) for pre-kickoff snapshot
    - cron: '0 15 * * 6'
    # Run every Sunday at 08:00 UTC (4:00 AM ET) for settling scores and Brier calibration
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  archive_and_settle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Weekly Snapshot
        run: |
          python3 scripts/generate_snapshot.py
          python3 scripts/settle_week_accuracy.py

      - name: Commit and Push Archive Snapshots
        run: |
          git config --global user.name "Gridiron Oracle Bot"
          git config --global user.email "bot@gridironoracle.ai"
          git add archive/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(archive): automated weekly snapshot and calibration update [skip ci]"
            git push origin main
          fi
