name: Weekly Archive & Model Calibration Sync

on:
  schedule:
    # Saturday 15:00 UTC (11:00 AM ET) - Pre-kickoff snapshot
    - cron: '0 15 * * 6'
    # Sunday 08:00 UTC (4:00 AM ET) - Early morning settlement of Saturday games & Brier grading
    - cron: '0 8 * * 0'
    # Sunday 18:30 UTC (2:30 PM ET) - Post-AP Poll Release & Official Sunday Afternoon Retraining
    - cron: '30 18 * * 0'
    # Sunday 19:30 UTC (3:30 PM ET) - Poll verification retry
    - cron: '30 19 * * 0'
    # Sunday 23:00 UTC (7:00 PM ET) - Sunday evening final wrap-up & future projections sync
    - cron: '0 23 * * 0'
    # Monday 06:00 UTC (2:00 AM ET) - Settle any Sunday night marquee games
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive_and_calibrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Weekly Simulation Snapshot
        run: python3 scripts/generate_snapshot.py

      - name: Settle Accuracy & Calculate Brier Score
        run: python3 scripts/settle_week_accuracy.py

      - name: Retrain Model & Recalculate Future Projections
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY || 'GNtgI3UY9ShOqcE0DTRDjaYycdGzBJDrqHjbgWT9lsw87ePi/iA4bjuNwak4WaC6' }}
        run: |
          python3 scripts/retrain_weekly_model.py
          # Synchronize updated datasets to mobile web packages
          cp data/teams.js data/teams_v3.js ios/CFBProphet/www/data/ || true
          cp data/teams.js data/teams_v3.js android/app/src/main/assets/www/data/ || true

      - name: Run Production Pre-Flight Inspection
        run: python3 scripts/validate_prod_readiness.py

      - name: Commit and Push Archive & Model Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/ data/ ios/ android/ index.html
          if git diff --staged --quiet; then
            echo "No archive or model changes to commit"
          else
            git commit -m "chore(model): automated weekly retraining, calibration, and future projections update"
            git push origin main
          fi
